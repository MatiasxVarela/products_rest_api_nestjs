services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
    ports:
      - '${DB_PORT:?DB_PORT is required}:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    restart: on-failure
    ports:
      - '${PORT:?PORT is required}:${PORT}'
    env_file: .env
    environment:
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD}@db:3306/${DB_NAME}
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  mysql_data: